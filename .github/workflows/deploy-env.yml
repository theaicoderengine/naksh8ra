# Deploys one environment. Order matters: images → migrate task (migrations, system seed,
# AI access verification) → services. Any failed step stops the rollout; nothing is skipped.
name: Deploy AWS environment (optional)
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      sha: { type: string, required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC to AWS; no long-lived AWS keys in GitHub
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENV_NAME: ${{ inputs.environment }}
      SHA: ${{ inputs.sha }}
      APP_URL: ${{ vars.APP_URL }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=atlas/${ENV_NAME}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Build and push images (immutable tags = commit SHA)
        working-directory: .
        run: |
          for target in web tooling; do
            repo="${{ steps.ecr.outputs.registry }}/atlas-${ENV_NAME}-${target}"
            if aws ecr describe-images --repository-name "atlas-${ENV_NAME}-${target}" --image-ids imageTag="$SHA" >/dev/null 2>&1; then
              echo "$repo:$SHA already exists"; continue
            fi
            docker build --target "$target" -t "$repo:$SHA" .
            docker push "$repo:$SHA"
          done

      - name: Register migrate task for this commit
        run: |
          terraform apply -input=false -auto-approve -var-file="env/${ENV_NAME}.tfvars" -var "image_tag=${SHA}" \
            -target=aws_ecs_task_definition.migrate

      - name: Run migrations + seed + AI access verification
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          SUBNETS=$(terraform output -json private_subnet_ids | tr -d '[] "\n')
          SG=$(terraform output -raw app_security_group_id)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE --task-definition "atlas-${ENV_NAME}-migrate" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migrate exit code: $CODE"
          if [ "$CODE" != "0" ]; then echo "::error::Migration task failed; services NOT updated. Logs: /atlas/${ENV_NAME}/migrate"; exit 1; fi

      - name: Roll out web, worker, clamav
        run: |
          terraform apply -input=false -auto-approve -var-file="env/${ENV_NAME}.tfvars" -var "image_tag=${SHA}"
          CLUSTER=$(terraform output -raw cluster_name)
          aws ecs wait services-stable --cluster "$CLUSTER" --services web worker clamav

      - name: Smoke tests
        working-directory: .
        run: |
          set -euo pipefail
          check() { # check <path> <expected status>
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$APP_URL$1")
            echo "$1 -> $code"; [ "$code" = "$2" ] || { echo "::error::$1 returned $code, expected $2"; exit 1; }
          }
          check /api/health 200
          check /api/ready 200
          check /login 200
          # HTTP must redirect to HTTPS; security headers must be present.
          http_url="${APP_URL/https:/http:}"
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "$http_url/api/health")" = "301" ]
          hdrs=$(curl -sSI "$APP_URL/login")
          for h in strict-transport-security content-security-policy x-content-type-options x-frame-options; do
            grep -qi "^$h:" <<<"$hdrs" || { echo "::error::missing header $h"; exit 1; }
          done
          # Anonymous API access must be refused.
          check /api/v1/organisations/current 401
