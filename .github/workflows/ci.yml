name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # CI-only throwaway credentials for the ephemeral service containers below.
  PGPASSWORD: postgres_ci

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://atlas_app:atlas_app_dev@localhost:5432/atlas?schema=public
      MIGRATION_DATABASE_URL: postgresql://atlas_owner:atlas_owner_dev@localhost:5432/atlas?schema=public
      APP_ENV: test
      APP_URL: http://localhost:3000
      QUEUE_MODE: inline
      LLM_PROVIDER: fixture
      STT_PROVIDER: fixture
      TTS_PROVIDER: browser
      ALLOW_FIXTURE_PROVIDERS: "true"
      EMAIL_PROVIDER: console
      STORAGE_PROVIDER: local
      LOG_LEVEL: warn
      EXPOSE_TEST_TOKENS: "true"
      RATE_LIMIT_MULTIPLIER: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Bootstrap database roles (atlas, atlas_test)
        run: |
          for db in atlas atlas_test; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
              -v owner_password="'atlas_owner_dev'" -v app_password="'atlas_app_dev'" -v db_name=$db \
              -f scripts/db/bootstrap-roles.sql
          done
          psql -h localhost -U postgres -c "CREATE DATABASE ci_shadow OWNER atlas_owner"

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Migrations match schema (no drift)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://atlas_owner:atlas_owner_dev@localhost:5432/ci_shadow" --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests (incl. RLS / cross-tenant / security)
        run: npm test

      - name: OpenAPI spec is up to date
        run: npm run openapi && git diff --exit-code docs/openapi.json

      - name: Build
        run: npm run build

      - name: Seed demo data for E2E
        run: npm run db:seed
        env:
          SEED_DEMO: "true"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Background jobs through the durable Postgres queue + in-process runner (the Hostinger path).
      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          QUEUE_MODE: postgres

      - name: Load test (smoke-sized)
        run: |
          (npm run start > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          PERF_REQUESTS=100 PERF_INTERVIEWS=10 npm run perf

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Full Hostinger deployment rehearsal: production-mode env from .env.hostinger.example,
  # DEPLOY_TARGET=hostinger build (preflight → build → migrate → seed → verify), npm start,
  # live verification, and a real job through the Postgres queue. Plus the role bootstrap
  # as a non-superuser admin, as on managed PostgreSQL services.
  hostinger-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Role bootstrap as a non-superuser admin (managed PostgreSQL)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE managed_admin LOGIN CREATEDB CREATEROLE PASSWORD 'managed_ci'"
          sed -e 's/atlas_owner/m_owner/g' -e 's/atlas_app/m_app/g' scripts/db/bootstrap-roles.sql > /tmp/boot.sql
          for i in 1 2; do
            PGPASSWORD=managed_ci psql -h localhost -U managed_admin -d postgres -v ON_ERROR_STOP=1 \
              -v owner_password="'m_owner_ci'" -v app_password="'m_app_ci'" -v db_name=managed_check -f /tmp/boot.sql
          done
          test "$(PGPASSWORD=m_app_ci psql -h localhost -U m_app -d managed_check -tAc 'SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user')" = "f"
      - name: Bootstrap database roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -v owner_password="'atlas_owner_dev'" -v app_password="'atlas_app_dev'" -v db_name=atlas_hostinger \
            -f scripts/db/bootstrap-roles.sql
      - name: Local S3 API and SMTP sink (throwaway)
        run: |
          python3 -m pip install --quiet "moto[server]==5.1.4" "aiosmtpd==1.4.6"
          (python3 -u -m moto.server -p 5005 > /tmp/moto.log 2>&1 &)
          (python3 -u -m aiosmtpd -n -l 127.0.0.1:2525 -c aiosmtpd.handlers.Debugging > /tmp/smtp.log 2>&1 &)
          for i in $(seq 1 30); do curl -s http://127.0.0.1:5005 >/dev/null && break; sleep 1; done
          node -e 'const {S3Client,CreateBucketCommand}=require("@aws-sdk/client-s3");new S3Client({region:"us-east-1",endpoint:"http://127.0.0.1:5005",forcePathStyle:true,credentials:{accessKeyId:"test",secretAccessKey:"test"}}).send(new CreateBucketCommand({Bucket:"atlas-files"})).then(()=>console.log("bucket ready"))'
      - name: Rehearse Hostinger deployment
        run: scripts/hostinger/rehearse.sh
        env:
          SMTP_LOG: /tmp/smtp.log

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # All dependencies (incl. dev/build tooling). Fails on high or critical advisories;
      # transitive pins live in package.json "overrides".
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build --target web -t atlas-web:${{ github.sha }} .
      - name: Build tooling (worker/migrate) image
        run: docker build --target tooling -t atlas-tooling:${{ github.sha }} .
      # Trivy's official image (pinned) instead of the GitHub Action, whose version tags
      # are no longer resolvable. Report-only until the base-image policy is agreed.
      - name: Scan images (Trivy)
        run: |
          for img in atlas-web atlas-tooling; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --no-progress "$img:${{ github.sha }}"
          done
